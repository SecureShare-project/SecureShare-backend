spring.application.name=secureshare
# --- Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/secureshare
spring.datasource.username = root
spring.datasource.password =${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Mail (Java Mail Sender) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lakshithmy03@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Server ---
server.port=8080

# --- JWT_SECRET ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

file.upload-dir=uploads

# in application.properties, not pom.xml — max upload size
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

#spring.profiles.active=dev